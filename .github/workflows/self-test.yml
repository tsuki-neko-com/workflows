name: Self test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # workers.yml が packages: read を要求するため、caller 側にも同じ権限が要る。
  # 再利用ワークフローは caller の権限を超えられず、超えると startup failure になる。
  packages: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  smoke:
    uses: ./.github/workflows/workers.yml
    with:
      node-version: "22"
      d1-database: ""
      deploy-enabled: false
    secrets: inherit

  # working-directory と npm-registry-scope の既定値を変えたケース。既定値のまま
  # 呼ぶ smoke ジョブを残しているので、両方が緑なら後方互換も保たれている。
  smoke-subdir:
    uses: ./.github/workflows/workers.yml
    with:
      node-version: "22"
      d1-database: ""
      deploy-enabled: false
      working-directory: fixtures/subdir
      npm-registry-scope: "@tsuki-neko-com"
    secrets: inherit

  publish-fixtures:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p android tauri
          printf 'fake apk' > android/selftest.apk
          printf 'fake nsis' > tauri/selftest.exe
          printf 'signature' > tauri/selftest.exe.sig
          printf 'fake deb' > tauri/selftest.deb
          printf '%s\n' '{"artifacts":[{"file":"selftest.exe","target":"windows","arch":"x86_64","kind":"nsis","updater":true,"sig_file":"selftest.exe.sig"},{"file":"selftest.deb","target":"linux","arch":"x86_64","kind":"deb","updater":false}]}' > tauri/nyanstall-artifacts.json
      - uses: actions/upload-artifact@v4
        with:
          name: publish-android
          path: android/
      - uses: actions/upload-artifact@v4
        with:
          name: publish-tauri
          path: tauri/

  publish-android-beta:
    needs: publish-fixtures
    uses: ./.github/workflows/nyanstall-publish.yml
    with:
      app: selftest-android
      mode: android
      tag: beta/0.2.14-beta.1
      source: artifact
      artifact-name: publish-android
      version: 0.2.14-beta.1
      channel: beta
      version-code: "201401"
      dry-run: true

  publish-tauri-beta:
    needs: publish-fixtures
    uses: ./.github/workflows/nyanstall-publish.yml
    with:
      app: selftest-tauri
      mode: tauri
      tag: beta/0.2.14-beta.1
      source: artifact
      artifact-name: publish-tauri
      version: 0.2.14-beta.1
      channel: beta
      dry-run: true

  publish-assert:
    needs: [publish-android-beta, publish-tauri-beta]
    runs-on: ubuntu-latest
    env:
      ANDROID: ${{ needs.publish-android-beta.outputs.payload }}
      TAURI: ${{ needs.publish-tauri-beta.outputs.payload }}
      ANDROID_VERSION: ${{ needs.publish-android-beta.outputs.version }}
      TAURI_VERSION: ${{ needs.publish-tauri-beta.outputs.version }}
    steps:
      - run: |
          set -euo pipefail
          test "$ANDROID_VERSION" = 0.2.14-beta.1
          test "$TAURI_VERSION" = 0.2.14-beta.1
          jq -e '.version == "0.2.14-beta.1" and .channel == "beta" and (.git_sha | test("^[0-9a-fA-F]{40}$")) and .version_code == 201401 and (.artifacts | length == 1) and .artifacts[0].r2_key == "apps/selftest-android/0.2.14-beta.1/selftest.apk" and (.artifacts[0].sha256 | test("^[0-9a-f]{64}$"))' <<< "$ANDROID"
          jq -e '.version == "0.2.14-beta.1" and .channel == "beta" and (.git_sha | test("^[0-9a-fA-F]{40}$")) and (.artifacts | length == 2) and ([.artifacts[].r2_key] | sort) == ["apps/selftest-tauri/0.2.14-beta.1/selftest.deb", "apps/selftest-tauri/0.2.14-beta.1/selftest.exe"] and all(.artifacts[]; .sha256 | test("^[0-9a-f]{64}$")) and ([.artifacts[] | select(.updater) | .signature] | all(. != null))' <<< "$TAURI"
